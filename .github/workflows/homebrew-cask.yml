name: Homebrew cask

# tap の cask を、このリポジトリの最新リリースに合わせる。版が同じなら何もしないので、何度走らせてもよい。
# リリースワークフローの末尾から呼ばれる。リリース直後の更新が失敗したら、手動実行でこのワークフローだけを走らせ直す。
on:
  workflow_call:
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    # brew style を使うので Homebrew の入った macOS イメージで走らせる。
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # トークンは tap だけに書ける fine-grained PAT。
      - name: Check out the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dominion525/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          CASK: tap/Casks/cmd-eikana.rb
        run: |
          set -euo pipefail

          # latest はドラフトとプレリリースを除いた最新のリリース。
          tag="$(gh release view -R "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          version="${tag#v}"

          # 版は sed の置換文字列とファイル名に入るので、版番号に使える文字だけを通す。
          case "${version}" in
            "" | *[!0-9.]*) echo "${tag} is not a version tag; refusing to write it into the cask." >&2; exit 1 ;;
          esac

          current="$(sed -n 's|^  version "\(.*\)"$|\1|p' "${CASK}")"
          if [ "${current}" = "${version}" ]; then
            echo "The cask already points at ${version}."
            exit 0
          fi

          archive="SwiftKeyRemap-v${version}-arm64.zip"
          gh release download "${tag}" -R "${GITHUB_REPOSITORY}" --pattern "${archive}" --dir "${RUNNER_TEMP}"
          sha="$(shasum -a 256 "${RUNNER_TEMP}/${archive}" | awk '{ print $1 }')"

          # リリースごとに変わる 2 行だけを書き換える。それ以外は tap 側で保守する。
          sed -i '' "s|^  version \".*\"|  version \"${version}\"|" "${CASK}"
          sed -i '' "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "${CASK}"

          # 一致しない sed は何も変えずに成功するので、両方が書き換わったことを確かめる。
          grep -qx "  version \"${version}\"" "${CASK}" || { echo "version was not updated in ${CASK}" >&2; exit 1; }
          grep -qx "  sha256 \"${sha}\"" "${CASK}" || { echo "sha256 was not updated in ${CASK}" >&2; exit 1; }

          # 構文の通らない cask を push しない。tap 側のチェックは push 後に走るので、ここで止める。
          brew style "${CASK}"

          cd tap
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "cmd-eikana ${version}"
          git push
