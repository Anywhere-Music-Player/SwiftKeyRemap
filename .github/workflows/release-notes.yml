name: Release notes

# リリースワークフローは、公開時点で GitHub が自動生成した本文（プルリクエストの一覧）からノートのページを書く。
# 手で書いたノートはたいてい後から、リリースを編集する形で入る。そのときにページを作り直し、
# フィードとリリースページの内容が食い違わないようにする。
#
# `published` は意図的にトリガーにしていない。GITHUB_TOKEN で作られたリリース（リリースワークフローはそうしている）は
# 別のワークフローを起動しない。最初のページはリリースワークフロー側で作る。
on:
  release:
    types: [edited]

permissions:
  contents: write

jobs:
  notes:
    # ビルドは行わないので macOS イメージは不要。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the update feed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: feed

      - name: Rebuild the notes page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # リリースは v* タグから作る。それ以外にはフィードに作り直すページが無い。
          case "${TAG}" in
            v*) ;;
            *) echo "${TAG} is not a release tag; nothing to rebuild."; exit 0 ;;
          esac
          version="${TAG#v}"

          # 版はパスの一部になり、タグはこのリポジトリではなくイベントから来るので、版番号に使える文字だけを通す。
          case "${version}" in
            "" | *[!0-9.]*) echo "${TAG} is not a version tag; refusing to build a path from it." >&2; exit 1 ;;
          esac

          ./Scripts/make-release-notes.sh "${TAG}" "feed/release-notes/${version}.html"

          cd feed
          git add -A
          if git diff --cached --quiet; then
            echo "The notes for ${version} are already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Release notes for ${version}"
          git push
