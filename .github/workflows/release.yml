name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-15 は arm64 イメージ。プロジェクトは arm64 専用ビルド。
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # 開発に使っている Xcode に固定する。イメージからこの版が消えたら上げる。
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      INFO_PLIST: cmd-eikana/Info.plist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # バージョンは Info.plist にある。タグと一致しなければ、アプリが名乗る版と違うリリースができてしまう。
      # CFBundleVersion は Sparkle が新旧判定に使う数値で、フィードの sparkle:version になる。
      - name: Check the tag against the project version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${INFO_PLIST}")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${INFO_PLIST}")"
          if [ "${tag}" != "${short}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${short} in ${INFO_PLIST}" >&2
            exit 1
          fi
          case "${build}" in
            "" | *[!0-9]*) echo "CFBundleVersion ${build} in ${INFO_PLIST} is not an integer" >&2; exit 1 ;;
          esac
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      # build.sh は Keychain の Developer ID 証明書を自分で拾うので、検索リストに証明書があればよい。
      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/build.keychain-db"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo -n "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security list-keychain -d user -s "${keychain}" login.keychain-db
          rm -f "${certificate}"

      - name: Build
        run: ./build.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          key="${RUNNER_TEMP}/notary.p8"
          echo -n "${NOTARY_KEY_P8_BASE64}" | base64 --decode > "${key}"
          NOTARY_KEY_P8="${key}" ./Scripts/notarize.sh
          rm -f "${key}"

      # ステープル後に固めるので、書庫の中のアプリが公証チケットを持つ。
      - name: Package the stapled app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ditto -c -k --keepParent "build/⌘英かな.app" "cmd-eikana-v${VERSION}-arm64.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${GITHUB_REF_NAME}" "cmd-eikana-v${VERSION}-arm64.zip" --generate-notes

      # ここから先はリリースが存在した状態で動くので、失敗してもリリースは残り、フィードだけが遅れる。
      - name: Check out the update feed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: feed

      - name: Publish the update to the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          # アプリがリンクしている版に固定し、署名形式がずれないようにする
          SPARKLE_VERSION: "2.9.6"
          SPARKLE_SHA256: "8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606"
        run: |
          set -euo pipefail

          # sign_update は Sparkle の配布物に入っている。チェックサムは Sparkle が Package.swift で公開しているもの。
          tools="${RUNNER_TEMP}/sparkle"
          mkdir -p "${tools}"
          curl -fsSL -o "${tools}/sparkle.zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip"
          actual="$(shasum -a 256 "${tools}/sparkle.zip" | awk '{ print $1 }')"
          if [ "${actual}" != "${SPARKLE_SHA256}" ]; then
            echo "Sparkle archive checksum mismatch: expected ${SPARKLE_SHA256}, got ${actual}" >&2
            exit 1
          fi
          unzip -q "${tools}/sparkle.zip" -d "${tools}"
          chmod +x "${tools}/bin/sign_update"

          # 鍵は標準入力で渡す。sign_update の -s は非推奨で、現行の generate_keys が作る鍵を受け付けない。
          archive="cmd-eikana-v${VERSION}-arm64.zip"
          signature="$(printf '%s' "${SPARKLE_PRIVATE_KEY}" \
            | "${tools}/bin/sign_update" --ed-key-file - "${archive}")"
          case "${signature}" in
            *sparkle:edSignature=*) ;;
            *) echo "sign_update did not return a signature: ${signature}" >&2; exit 1 ;;
          esac

          # Sparkle は更新ダイアログにリリース本文を表示する。本文が後から編集されたら release-notes.yml が同じ
          # スクリプトを呼び直す。
          ./Scripts/make-release-notes.sh "${GITHUB_REF_NAME}" "feed/release-notes/${VERSION}.html"

          # 新しい item を channel の直後に入れるので、既存の item を書き換えずに新しい順が保たれる。
          pubdate="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "build/⌘英かな.app/Contents/Info.plist")"

          # sparkle:version は、インストール済みの CFBundleVersion と比べて新しいかを Sparkle が判定する値。
          # フィードにある最大値を超えていなければ、誰にも提示されないリリースになるので拒否する。
          highest="$(grep -o 'sparkle:version="[^"]*"' feed/appcast.xml | cut -d'"' -f2 | sort -n | tail -1)"
          if [ -n "${highest}" ] && [ "${BUILD}" -le "${highest}" ]; then
            echo "CFBundleVersion ${BUILD} is not above ${highest}, which the feed already carries" >&2
            exit 1
          fi

          item="${RUNNER_TEMP}/item.xml"
          cat > "${item}" <<XML
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${pubdate}</pubDate>
                <sparkle:minimumSystemVersion>${minimum}</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://eikana.dominion525.com/release-notes/${VERSION}.html</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/dominion525/cmd-eikana/releases/download/${GITHUB_REF_NAME}/${archive}"
                           sparkle:version="${BUILD}"
                           sparkle:shortVersionString="${VERSION}"
                           ${signature}
                           type="application/octet-stream"/>
              </item>
          XML
          sed -i '' -e "/<\\/language>/r ${item}" feed/appcast.xml

          # item が入らなかったフィードは、誰も更新できなくなるまで気付かれない。
          grep -q "<title>Version ${VERSION}</title>" feed/appcast.xml \
            || { echo "the appcast did not gain an item for ${VERSION}" >&2; exit 1; }
          xmllint --noout feed/appcast.xml

          cd feed
          git add -A
          if git diff --cached --quiet; then
            echo "The feed already carries ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "⌘英かな ${VERSION}"
          git push
