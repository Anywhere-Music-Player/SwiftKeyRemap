name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# リリースビルド（release.yml）と同じ macOS 26 のイメージと Xcode で検証する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode の版を表示
        run: xcodebuild -version
      # 計測データとバイナリの場所を次のステップで指定するため、DerivedData の置き場所を固定する
      - name: テスト
        run: xcodebuild test -quiet -project "⌘英かな.xcodeproj" -scheme "⌘英かな" -destination 'platform=macOS' -derivedDataPath "${RUNNER_TEMP}/DerivedData" -enableCodeCoverage YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # 行・関数・リージョン・分岐のカバレッジを llvm-cov で集計して表にする。閾値による合否の判定はしない。
      # テストが落ちた回の数字は比べる意味が無いので、テストが通ったときだけ走る。
      - name: カバレッジをサマリーに出す
        run: |
          set -euo pipefail

          derived="${RUNNER_TEMP}/DerivedData"
          profdata="$(find "${derived}/Build/ProfileData" -name Coverage.profdata -print -quit)"
          [ -n "${profdata}" ] || { echo "Coverage.profdata was not found under ${derived}" >&2; exit 1; }
          products="${derived}/Build/Products/Debug"
          app="${products}/⌘英かな.app/Contents/MacOS/⌘英かな.debug.dylib"
          helper="${products}/cmd-eikana-helper.app/Contents/MacOS/cmd-eikana-helper.debug.dylib"

          # 割合は件数から計算し、小数点第 2 位まで出す。対象が 0 件の指標（Swift の分岐など）は - にする。
          row() {
            local name="$1"
            shift
            xcrun llvm-cov export -summary-only -instr-profile "${profdata}" "$@" \
              | jq -r '.data[0].totals | [.lines, .functions, .regions, .branches] | map("\(.covered) \(.count)") | join(" ")' \
              | awk -v name="${name}" '{
                  printf "| %s |", name
                  for (i = 1; i <= NF; i += 2) {
                    if ($(i + 1) == 0) printf " - |"
                    else printf " %.2f%% (%d/%d) |", $i * 100 / $(i + 1), $i, $(i + 1)
                  }
                  print ""
                }'
          }

          {
            echo "## カバレッジ"
            echo
            echo "| 対象 | 行 | 関数 | リージョン | 分岐 |"
            echo "| :--- | ---: | ---: | ---: | ---: |"
            row "⌘英かな.app" "${app}"
            row "cmd-eikana-helper" "${helper}"
            row "合計" "${app}" -object "${helper}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode の版を表示
        run: xcodebuild -version
      - name: Release ビルド
        run: xcodebuild -quiet -project "⌘英かな.xcodeproj" -scheme "⌘英かな" -configuration Release -arch arm64 build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
