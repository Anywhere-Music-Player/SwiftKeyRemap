name: Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# リリースビルド（release.yml）と同じ macOS 26 のイメージと Xcode で検証する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: read
      # Comment coverage on the PRため
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      # 計測データとバイナリの場所を次のステップで指定するため、DerivedData の置き場所を固定する
      - name: Run tests
        run: xcodebuild test -quiet -project "SwiftKeyRemap.xcodeproj" -scheme "SwiftKeyRemap" -destination 'platform=macOS' -derivedDataPath "${RUNNER_TEMP}/DerivedData" -enableCodeCoverage YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # 行・関数・リージョン・分岐のカバレッジを llvm-cov で集計して表にする。閾値による合否の判定はしない。
      # テストが落ちた回の数字は比べる意味が無いので、テストが通ったときだけ走る。
      # 表は次のステップが PR へのコメントにも使うので、ファイルに書いてからサマリーに足す。
      - name: Write coverage summary
        run: |
          set -euo pipefail

          derived="${RUNNER_TEMP}/DerivedData"
          profdata="$(find "${derived}/Build/ProfileData" -name Coverage.profdata -print -quit)"
          [ -n "${profdata}" ] || { echo "Coverage.profdata was not found under ${derived}" >&2; exit 1; }
          # Debug ビルドのコードは実行ファイルではなく .debug.dylib に入る
          products="${derived}/Build/Products/Debug"
          app="${products}/SwiftKeyRemap.app/Contents/MacOS/SwiftKeyRemap.debug.dylib"

          # GeneratedAssetSymbols.swift など、ビルド時に DerivedData に生成されるコードは集計しない
          export_summary() {
            xcrun llvm-cov export -summary-only -instr-profile "${profdata}" -ignore-filename-regex '/DerivedData/' "$@"
          }

          # 集計 1 件を「名前、行・関数・リージョン・分岐それぞれの実行数と件数」のタブ区切りにする
          counts='[.lines, .functions, .regions, .branches] | map(.covered, .count)'
          totals() {
            local name="$1"
            shift
            export_summary "$@" | jq -r --arg name "${name}" "[\$name] + (.data[0].totals | ${counts}) | @tsv"
          }

          # 割合は件数から計算し、小数点第 2 位まで出す。対象が 0 件の指標（Swift の分岐など）は - にする。
          rows() {
            awk -F '\t' '{
              printf "| %s |", $1
              for (i = 2; i <= NF; i += 2) {
                if ($(i + 1) == 0) printf " - |"
                else printf " %.2f%% (%d/%d) |", $i * 100 / $(i + 1), $i, $(i + 1)
              }
              print ""
            }'
          }

          report="${RUNNER_TEMP}/coverage.md"
          {
            # PR のコメントを書き換えるときに、このコメントを見分ける目印
            echo "<!-- coverage-summary -->"
            echo "## Coverage"
            echo
            echo "| Target | Lines | Functions | Regions | Branches |"
            echo "| :--- | ---: | ---: | ---: | ---: |"
            {
              totals "SwiftKeyRemap.app" "${app}"
            } | rows
            echo
            echo "<details>"
            echo "<summary>By file</summary>"
            echo
            echo "| File | Lines | Functions | Regions | Branches |"
            echo "| :--- | ---: | ---: | ---: | ---: |"
            export_summary "${app}" \
              | jq -r --arg root "${GITHUB_WORKSPACE}/" \
                  ".data[0].files | sort_by(.filename)[] | [.filename | ltrimstr(\$root)] + (.summary | ${counts}) | @tsv" \
              | rows
            echo
            echo "</details>"
          } > "${report}"
          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"

      # フォークからの PR では GITHUB_TOKEN が読み取り専用で投稿できないので、このリポジトリのブランチからの PR だけでコメントする。
      # push のたびにコメントが増えないよう、目印の付いた既存のコメントがあれば書き換える。
      - name: Comment coverage on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          report="${RUNNER_TEMP}/coverage.md"
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-summary -->"))) | .id' \
            | awk 'NR == 1')"
          if [ -n "${id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"${report}" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"${report}" > /dev/null
          fi

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build Release
        run: xcodebuild -quiet -project "SwiftKeyRemap.xcodeproj" -scheme "SwiftKeyRemap" -configuration Release -arch arm64 build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
